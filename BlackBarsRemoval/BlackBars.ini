; ZZZ Pillarbox Only v0.1 - 5120x1440, DX11/ZZMI.
; Matches the two side rectangles observed in three 2026-10-26 captures.
; Does not replace textures or discard general black UI.
namespace = ZZZPillarboxOnly

[Constants]
global $enabled = 1

[KeyTogglePillarbox]
key = no_modifiers F7
type = cycle
$enabled = 0, 1

[TextureOverridePillarboxVertices]
hash = 9c1c7deb
filter_index = 32901

[TextureOverridePillarboxIndices]
hash = 4bcf6f40
filter_index = 32902

[TextureOverrideSharedBlackTexture]
hash = b7ff7a6e
filter_index = 32903

[ShaderOverridePillarboxDraw]
hash = 857cd16250c6142e
allow_duplicate_hash = true
if $enabled && vb0 == 32901 && ib == 32902 && ps-t0 == 32903 && index_count == 12
    handling = skip
endif
